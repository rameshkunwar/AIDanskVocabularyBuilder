name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================================
  # CI: Test and Validate Frontend & Backend
  # ==========================================================
  ci-frontend:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check and build test
        run: npm run build
        env:
          VITE_API_URL: https://api.ramesh.dk

  ci-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "backend/.python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check code syntax & imports
        run: uv run python -m compileall app/

  # ==========================================================
  # CD: Deploy to Hetzner VPS via SSH
  # ==========================================================
  deploy:
    name: Deploy to Hetzner VPS
    needs: [ci-frontend, ci-backend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"

            echo "🚀 Navigating to deployment directory: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo "📥 Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔑 Injecting environment files..."
            cat <<'EOF' > .env
            ${{ secrets.ROOT_ENV }}
            EOF

            cat <<'EOF' > backend/.env
            ${{ secrets.BACKEND_ENV }}
            EOF

            echo "🐳 Rebuilding and restarting Docker containers..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Cleaning up dangling docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
